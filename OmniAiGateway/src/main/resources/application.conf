gateway {
  port = 1900

  telemetryEnabled = true
  otelEnabled = true
  otelCollectorEndpoint = "http://127.0.0.1:4317"

  providers {
    gemini {
      model = ["gemini-2.5-flash", "gemini-3-flash-preview" ]
      baseUrl = "https://europe-west1-aiplatform.googleapis.com/v1/projects/cn2526-t2-g01/locations/europe-west1/publishers/google"
    }
  }

  # Authorization Server (AS) — Logto via OIDC Discovery
  # Configure via env vars (preferido) ou diretamente abaixo:
  # AUTH_DISCOVERY_URL, AUTH_AUDIENCE, AUTH_CLIENT_ID, AUTH_CLIENT_SECRET
  #
  # Logto corre na porta 3001 (OIDC/app) e 3002 (Admin Console).
  # Na primeira visita a http://localhost:3002 cria a conta de admin.
  #
  # Após configurar o Logto:
  #  1. Cria um API Resource → o seu identifier é o "audience" abaixo
  #  2. Cria uma M2M Application → copia clientId e clientSecret abaixo
  #
  # Discovery URL: http://localhost:3001/oidc/.well-known/openid-configuration
  auth {
    discoveryUrl = "http://localhost:3001/oidc/.well-known/openid-configuration"
    audience     = "https://api.omniai.com"   # ← substituir pelo API Resource identifier criado no Logto
    clientId     =  "jotp35yrirzn7sgknzxbt"   # ← da M2M Application no Logto
    clientSecret =  "" # ← da M2M Application no Logto
  }
}
