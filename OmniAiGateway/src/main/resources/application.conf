gateway {
  port = 1900

  telemetryEnabled = true
  otelEnabled = true
  otelCollectorEndpoint = "http://127.0.0.1:4317"

  providers {
    gemini {
      model = ["gemini-2.5-flash", "gemini-3-flash-preview" ]
      baseUrl = "https://europe-west1-aiplatform.googleapis.com/v1/projects/cn2526-t2-g01/locations/europe-west1/publishers/google"
    }
  }

  # Authorization Server (AS) — Keycloak via OIDC Discovery
  # Configure via env vars (preferido) ou diretamente abaixo:
  # AUTH_DISCOVERY_URL, AUTH_AUDIENCE, AUTH_CLIENT_ID, AUTH_CLIENT_SECRET
  #
  # Keycloak corre internamente na 8080, exposto externamente em 9080.
  # Admin UI: http://localhost:9080  (admin / admin)
  #
  # Discovery URL format:
  #   http://localhost:9080/realms/<realm>/.well-known/openid-configuration
  auth {
    discoveryUrl = "http://localhost:9080/realms/omniai/.well-known/openid-configuration"
    audience     = "my-api"
    clientId     = "my-api"
    clientSecret = "xyhYzmy3uphucNkDP7LnbVMzYR76dGsH"
  }
}
