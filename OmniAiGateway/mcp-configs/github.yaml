tools:
  - name: "github_zen"
    description: "Get a random quote from the GitHub design philosophy API"
    targetUrl: "https://api.github.com/zen"
    method: "GET"
    headers:
      Accept: "text/plain"
      User-Agent: "OmniAI-MCP-Gateway"

  - name: "github_octocat"
    description: "Get the ASCII art of Octocat with a message"
    targetUrl: "https://api.github.com/octocat"
    method: "GET"
    headers:
      Accept: "text/plain"
      User-Agent: "OmniAI-MCP-Gateway"

  - name: "github_meta"
    description: "Get GitHub API meta information, including official IP ranges and SSH keys"
    targetUrl: "https://api.github.com/meta"
    method: "GET"
    headers:
        Accept: "application/json"
        User-Agent: "OmniAI-MCP-Gateway"

  - name: "github_user_info"
    description: "Get public information about a specific GitHub user"
    targetUrl: "https://api.github.com/users/{username}"
    method: "GET"
    headers:
      Accept: "application/json"
      User-Agent: "OmniAI-MCP-Gateway"
    inputSchema:
      username: "string"

  - name: "github_render_markdown"
    description: "Render a markdown string into HTML using GitHub's markdown API"
    targetUrl: "https://api.github.com/markdown"
    method: "POST"
    headers:
      Accept: "text/html"
      User-Agent: "OmniAI-MCP-Gateway"
    inputSchema:
      text: "string"

contexts:
  - name: "github_api_info"
    uri: "context://github-api-info"
    description: "Documentation about the GitHub API endpoints being used"
    content: |
      The OmniAI MCP Gateway exposes simple GitHub endpoints:
      - /zen: Returns a random design philosophy quote.
      - /octocat: Returns an ASCII art octocat.