name: OmniAiGateway CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run checks on OmniAiGateway-Core
        run: ./gradlew -p OmniAi-SDK check

      - name: Run checks on OmniAiGateway
        run: ./gradlew -p OmniAiGateway check
